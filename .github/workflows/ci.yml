name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [22, 24]
        dsh: ['0.2.0-rc.2', '0.2.1-rc.2']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node scripts/check-docs.mjs
      - name: Install the tested official DSH runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" @deepseek-ai/dsh@${{ matrix.dsh }} pnpm@11.28.5
          echo "$RUNNER_TEMP/dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Pack committed runtime and the verified rollback version
        run: |
          npm run release:pack -- --out "$RUNNER_TEMP/candidate"
          mkdir "$RUNNER_TEMP/rollback-source" "$RUNNER_TEMP/rollback-package"
          git archive c1c88a1dca9651694228838fe3df17d9a982c202 | tar -x -C "$RUNNER_TEMP/rollback-source"
          npm pack "$RUNNER_TEMP/rollback-source" --ignore-scripts --pack-destination "$RUNNER_TEMP/rollback-package"
      - name: Install, boot, upgrade, roll back, disable and remove the actual archive
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ '${{ matrix.dsh }}' = '0.2.0-rc.2' ]; then
            npm run test:install -- --dsh-version '${{ matrix.dsh }}' --package "$RUNNER_TEMP/candidate/dsh-ssh-remote-$version.tgz" --previous "$RUNNER_TEMP/rollback-package/dsh-ssh-remote-0.10.2.tgz" --out "$RUNNER_TEMP/install-evidence"
          else
            npm run test:install -- --dsh-version '${{ matrix.dsh }}' --package "$RUNNER_TEMP/candidate/dsh-ssh-remote-$version.tgz" --out "$RUNNER_TEMP/install-evidence"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ matrix.os }}-node-${{ matrix.node }}-dsh-${{ matrix.dsh }}
          path: ${{ runner.temp }}/install-evidence

  next-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: node scripts/check-dsh-sdk.mjs 0.2.1-rc.2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install file-discovery test dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm test
      - run: npm run build
      - name: Verify committed build artifacts
        run: |
          git diff --exit-code
          git status --short
          test -z "$(git status --porcelain)"

  helper-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - name: Install file-discovery test dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm run test:helper
      - run: npx vitest run test/helper-python.integration.test.ts test/helper-concurrency.integration.test.ts test/editor.integration.test.ts test/discovery.integration.test.ts test/transfer-helper.integration.test.ts test/transfers.integration.test.ts test/helper-adapters.integration.test.ts test/terminal-state-helper.integration.test.ts

  bash-44:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build isolated minimum supported Bash (not installed system-wide)
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location https://ftp.gnu.org/gnu/bash/bash-4.4.tar.gz -o bash-4.4.tar.gz
          echo 'd86b3392c1202e8ff5a423b302e6284db7f8f435ea9f39b5b1b20fd3ac36dfcb  bash-4.4.tar.gz' | sha256sum --check
          tar -xzf bash-4.4.tar.gz
          cd bash-4.4
          ./configure --without-bash-malloc
          make -j2
      - name: Exercise minimum Bash shell hooks
        run: DSH_TEST_BASH="$RUNNER_TEMP/bash-4.4/bash" npx vitest run test/terminal-state-helper.integration.test.ts

  macos:
    # Exercise Darwin-only guardian, PTY and ignored-SIGCHLD regressions.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Require file-discovery test dependency
        run: command -v rg || brew install ripgrep
      - run: npm test
      - run: npm run build
      - name: Verify committed build artifacts
        run: |
          git diff --exit-code
          git status --short
          test -z "$(git status --porcelain)"

  helper-sandbox-required:
    # Jammy avoids Noble's additional AppArmor userns policy. Keep the host's
    # protections intact: failure to run bwrap must fail this positive-path job.
    runs-on: ubuntu-22.04
    env:
      DSH_REQUIRE_BWRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install distribution-supported bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Require unprivileged sandbox support without relaxing host policy
        run: |
          bwrap --version
          bwrap --help | grep -- --bind-fd
          bwrap --die-with-parent --unshare-pid --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- /bin/true
      - run: npm ci
      - name: Require positive restricted-execution coverage
        run: npx vitest run test/helper-sandbox-required.integration.test.ts test/helper-python.integration.test.ts
