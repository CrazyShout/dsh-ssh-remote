name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed build artifacts
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  helper-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run test:helper
      - run: npx vitest run test/helper-python.integration.test.ts

  macos:
    # Exercise Darwin-only guardian, PTY and ignored-SIGCHLD regressions.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed build artifacts
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  helper-sandbox-required:
    # Jammy avoids Noble's additional AppArmor userns policy. Keep the host's
    # protections intact: failure to run bwrap must fail this positive-path job.
    runs-on: ubuntu-22.04
    env:
      DSH_REQUIRE_BWRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install distribution-supported bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Require unprivileged sandbox support without relaxing host policy
        run: |
          bwrap --version
          bwrap --help | grep -- --bind-fd
          bwrap --die-with-parent --unshare-pid --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- /bin/true
      - run: npm ci
      - name: Require positive restricted-execution coverage
        run: npx vitest run test/helper-sandbox-required.integration.test.ts test/helper-python.integration.test.ts
